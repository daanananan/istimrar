const COLORS = ['#9ED3A8', '#F6C177', '#F2A0A0', '#9CC7EE', '#C8B1E8', '#F2D16B', '#8FD6CB', '#E8B4C8', '#CFCFC4'];
const PRESETS = { water: { name: 'شرب الماء', emoji: '💧', color: '#9CC7EE', target: 7, kind: 'main' }, walk: { name: 'المشي', emoji: '🚶‍♀️', color: '#9ED3A8', target: 1, kind: 'main' }, read: { name: 'قراءة ورد', emoji: '📖', color: '#F6C177', target: 1, kind: 'main' } };

function openTaskForm(task, preset) {
  const today = TODAY(); const cur = task ? (E.ver(task, today) || task.versions[0]) : null;
  const f = task ? { name: cur.name, desc: cur.desc, emoji: task.emoji, color: task.color, kind: cur.kind, days: cur.days ? cur.days.slice() : [], target: cur.target, weeklyMode: cur.weeklyMode, weeklyCount: cur.weeklyCount, streak: cur.streak, dev: cur.dev || 1, tod: cur.tod || '', why: task.why || '', remind: task.remind || '' }
    : Object.assign({ name: '', desc: '', emoji: '🌿', color: COLORS[0], kind: 'main', days: [], target: 1, weeklyMode: 'days', weeklyCount: 3, streak: true, dev: 1, tod: '', why: '', remind: '' }, preset || {});
  const al0 = E.allowance(ST, today, task ? 0 : 1);
  const firstMain = !task && E.allowance(ST, today, 0).total === 0;
  let m;
  const draw = () => {
    const mainLike = f.kind === 'main' || (f.kind === 'weekly' && f.weeklyMode === 'days');
    const canExempt = task && !cur.streak ? true : al0.left > 0;
    const askStreak = (mainLike && !firstMain) || (f.kind === 'weekly' && f.weeklyMode === 'count');
    m.el.querySelector('.sheet').innerHTML =
      '<h2>' + (task ? 'تعديل المهمة' : 'مهمة جديدة') + '</h2>' +
      '<div class="field"><label for="tfName">اسم المهمة</label><input type="text" id="tfName" value="' + esc(f.name) + '" maxlength="60"></div>' +
      '<div class="field"><label for="tfDesc">وصف (اختياري)</label><textarea id="tfDesc" maxlength="200">' + esc(f.desc) + '</textarea></div>' +
      '<div class="field"><label for="tfWhy">لماذا أفعل هذا؟ (اختياري)</label><textarea id="tfWhy" maxlength="160" placeholder="سبب يهمّك، سأذكّرك به في الأيام الصعبة">' + esc(f.why) + '</textarea></div>' +
      '<div class="field"><div class="lbl">النوع</div><div class="seg">' + [['main', 'رئيسية'], ['side', 'إضافية'], ['weekly', 'أسبوعية']].map((k) => '<button data-k="' + k[0] + '" aria-pressed="' + (f.kind === k[0]) + '">' + k[1] + '</button>').join('') + '</div><div class="small muted">' + ({ main: 'تدخل في شرط إكمال اليوم والاستمرارية.', side: 'اختيارية: تمنح مكافأة ولا يضرّ تركها.', weekly: 'تظهر كرئيسية في أيام تحدّدينها، أو بعدد مرات خلال الأسبوع.' }[f.kind]) + '</div></div>' +
      (f.kind === 'weekly' ? '<div class="field"><div class="lbl">طريقة الجدولة</div><div class="seg"><button data-wm="days" aria-pressed="' + (f.weeklyMode === 'days') + '">أيام محددة</button><button data-wm="count" aria-pressed="' + (f.weeklyMode === 'count') + '">عدد مرات في الأسبوع</button></div>' + (f.weeklyMode === 'count' ? '<div class="stepper"><button class="circ mini" data-wc="-1" aria-label="أقل">' + ico('minus') + '</button><output class="num">' + N(f.weeklyCount) + '</output><span>مرات في الأسبوع</span><button class="circ mini" data-wc="1" aria-label="أكثر">' + ico('plus') + '</button></div><div class="small muted">لا تؤثر على اليوم العادي. إذا بقي من الأسبوع بقدر ما بقي من مرات لم تُنجَز، تتحول إلى رئيسية في ذلك اليوم.</div>' : '') + '</div>' : '') +
      (!(f.kind === 'weekly' && f.weeklyMode === 'count') ? '<div class="field"><div class="lbl">' + (f.kind === 'weekly' ? 'الأيام' : 'أيام التكرار') + '</div><div class="daychips">' + [6, 0, 1, 2, 3, 4, 5].map((d) => '<button data-d="' + d + '" aria-pressed="' + f.days.includes(d) + '">' + DSHORT[d] + '</button>').join('') + '</div><div class="small muted">' + (f.kind === 'weekly' ? 'اختاري يومًا على الأقل.' : 'بلا اختيار تتكرر كل يوم.') + '</div></div>' : '') +
      (f.kind !== 'weekly' ? '<div class="field"><div class="lbl">عدد مرات الإنجاز يوميًا</div><div class="stepper"><button class="circ mini" data-t="-1" aria-label="أقل">' + ico('minus') + '</button><output class="num">' + N(f.target) + '</output><button class="circ mini" data-t="1" aria-label="أكثر">' + ico('plus') + '</button></div><div class="small muted">تُكافأ المهمة عند اكتمال العدد المطلوب.</div></div>' : '') +
      '<div class="field"><div class="lbl">وقت المهمة</div><div class="seg">' + [['', 'أي وقت'], ['morning', 'الصباح الباكر'], ['noon', 'الظهر والعصر'], ['night', 'الليل']].map((k) => '<button data-tod="' + k[0] + '" aria-pressed="' + (f.tod === k[0]) + '">' + k[1] + '</button>').join('') + '</div></div>' +
      '<div class="field"><div class="lbl">تذكير بهذه المهمة</div><div class="seg"><button data-rem="0" aria-pressed="' + !f.remind + '">بدون تذكير</button><button data-rem="1" aria-pressed="' + !!f.remind + '">ذكّريني</button></div>' + (f.remind ? '<div class="row" style="gap:10px;align-items:center;margin-top:8px"><label for="tfRem" class="small muted">في الساعة</label><input type="time" id="tfRem" value="' + esc(f.remind) + '" style="max-width:150px"></div><div class="small muted">يظهر التذكير في أيام المهمة إن لم تنجزيها بعد، حين يكون التطبيق مفتوحًا. وصول التذكير والتطبيق مغلق يحتاج خطوة إضافية سنضيفها لاحقًا.</div>' : '') + '</div>' +
      '<div class="field"><div class="lbl">نقاط التطوير عند الإنجاز</div><div class="stepper"><button class="circ mini" data-dv="-1" aria-label="أقل">' + ico('minus') + '</button><output class="num">' + N(f.dev) + '</output><button class="circ mini" data-dv="1" aria-label="أكثر">' + ico('plus') + '</button></div></div>' +
      '<div class="field"><div class="lbl">الإيموجي</div><input type="text" id="tfEmoji" value="' + esc(f.emoji) + '" maxlength="8" style="font-size:22px;text-align:center" aria-label="الإيموجي"><div class="emojis">' + EMOJIS.map((e) => '<button data-e="' + e + '" type="button">' + e + '</button>').join('') + '</div><div class="small muted">اكتبي أي إيموجي من لوحة مفاتيحك أو الصقيه.</div></div>' +
      '<div class="field"><div class="lbl">لون الدائرة</div><div class="swatches">' + COLORS.map((c) => '<button data-c="' + c + '" style="background:' + c + '" aria-label="لون" aria-pressed="' + (f.color === c) + '"></button>').join('') + '</div></div>' +
      (askStreak ? '<div class="field"><div class="lbl">هل تريد أن تكون هذه المهمة مسؤولة عن حساب الاستمرارية؟</div><div class="seg"><button data-s="1" aria-pressed="' + f.streak + '">نعم</button><button data-s="0" aria-pressed="' + !f.streak + '" ' + (canExempt ? '' : 'disabled') + '>لا</button></div><div class="small muted">يسمح لك باستثناء نسبة ضئيلة تصل إلى 30% فقط من مهامك لكي لا تؤثر على الاستمرارية في أوقات انشغالك.' + (canExempt ? '' : ' وصلتِ إلى الحد الآن.') + '</div></div>' : (firstMain && mainLike ? '<div class="note">أول مهمة رئيسية: تصبح مسؤولة عن الاستمرارية تلقائيًا.</div>' : '')) +
      (task ? '<div class="note">التعديل يسري من اليوم، ولا يغيّر ما سُجّل في الأيام الماضية.</div>' : '') +
      '<div class="actions" style="margin-top:14px"><button class="btn" data-save>' + (task ? 'حفظ' : 'إضافة') + '</button>' + (task ? '<button class="btn danger" data-del>حذف</button>' : '') + '<button class="btn soft" data-close>إلغاء</button></div>';
    bind();
  };
  const sync = () => { const n = m.el.querySelector('#tfName'); if (n) { f.name = n.value; f.desc = m.el.querySelector('#tfDesc').value; f.why = m.el.querySelector('#tfWhy').value; f.emoji = m.el.querySelector('#tfEmoji').value || '🌿'; const tr = m.el.querySelector('#tfRem'); if (tr && tr.value) f.remind = tr.value; } };
  const bind = () => {
    const el = m.el;
    el.querySelectorAll('[data-k]').forEach((b) => b.addEventListener('click', () => { sync(); f.kind = b.dataset.k; if (f.kind === 'side') f.streak = false; else if (f.kind === 'main') f.streak = true; draw(); }));
    el.querySelectorAll('[data-wm]').forEach((b) => b.addEventListener('click', () => { sync(); f.weeklyMode = b.dataset.wm; f.streak = f.weeklyMode === 'days'; draw(); }));
    el.querySelectorAll('[data-d]').forEach((b) => b.addEventListener('click', () => { sync(); const d = +b.dataset.d; f.days = f.days.includes(d) ? f.days.filter((x) => x !== d) : f.days.concat(d); draw(); }));
    el.querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => { sync(); f.target = Math.max(1, Math.min(99, f.target + +b.dataset.t)); draw(); }));
    el.querySelectorAll('[data-rem]').forEach((b) => b.addEventListener('click', () => { sync(); if (b.dataset.rem === '1') { f.remind = f.remind || ({ morning: '07:00', noon: '13:00', night: '21:00' }[f.tod] || '12:00'); askNotifyPerm(); } else f.remind = ''; draw(); }));
    el.querySelectorAll('[data-tod]').forEach((b) => b.addEventListener('click', () => { sync(); f.tod = b.dataset.tod; draw(); }));
    el.querySelectorAll('[data-dv]').forEach((b) => b.addEventListener('click', () => { sync(); f.dev = Math.max(1, Math.min(3, f.dev + +b.dataset.dv)); draw(); }));
    el.querySelectorAll('[data-wc]').forEach((b) => b.addEventListener('click', () => { sync(); f.weeklyCount = Math.max(1, Math.min(7, f.weeklyCount + +b.dataset.wc)); draw(); }));
    el.querySelectorAll('[data-e]').forEach((b) => b.addEventListener('click', () => { sync(); f.emoji = b.dataset.e; draw(); }));
    el.querySelectorAll('[data-c]').forEach((b) => b.addEventListener('click', () => { sync(); f.color = b.dataset.c; draw(); }));
    el.querySelectorAll('[data-s]').forEach((b) => b.addEventListener('click', () => { sync(); f.streak = b.dataset.s === '1'; draw(); }));
    el.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => m.close()));
    const sv = el.querySelector('[data-save]'); if (sv) sv.addEventListener('click', () => {
      sync();
      const probe = E.clone(ST); const r = task ? E.updateTask(probe, task.id, f, today) : E.addTask(probe, f, today);
      if (!r.ok) { err(r.error); return; }
      m.close(); act((s) => { if (task) E.updateTask(s, task.id, f, today); else E.addTask(s, f, today); });
    });
    const dl = el.querySelector('[data-del]'); if (dl) dl.addEventListener('click', async () => {
      const ok = await confirmDlg({ title: 'حذف المهمة؟', body: '<p>تُحذف المهمة من اليوم فصاعدًا، وتبقى إنجازاتها السابقة في السجل والإحصاءات.</p>', ok: 'حذف', danger: true });
      if (ok) { m.close(); act((s) => E.deleteTask(s, task.id, today)); }
    });
  };
  m = modal('<div></div>', { noFocus: true, sticky: true });
  draw();
}

/* ---------- أفعال ---------- */
async function setTaskCount(id, delta, btn) {
  const today = TODAY(); const D = VIEWDAY || today; if (D > today) return;
  const cur = E.countOf(ST, id, D); const next = Math.max(0, cur + delta); if (next === cur) return;
  const t = ST.tasks.find((x) => x.id === id); const name = E.ver(t, D).name;
  if (D === today) {
    const r = btn ? btn.getBoundingClientRect() : null;
    const model = R.todayModel.items.find((i) => i.task.id === id);
    const completes = model && delta > 0 && model.done + 1 === model.target;
    act((s) => E.setCount(s, id, D, next), completes && r ? { burst: { x: r.left + r.width / 2, y: r.top + r.height / 2 } } : {});
    return;
  }
  const p = E.previewEdit(ST, (s) => E.setCount(s, id, D, next), today);
  if (p.negative) { err('لا يمكن هذا التعديل لأن رصيدك سيصبح سالبًا بعد مشترياتك السابقة.'); return; }
  const eff = [];
  eff.push('<li>العملات: <b class="num">' + (p.diff.delta >= 0 ? '+' : '−') + N(Math.abs(p.diff.delta)) + '</b></li>');
  if (p.streakDelta) eff.push('<li>الاستمرارية: ' + N(p.before.streak) + ' ← ' + N(p.after.streak) + '</li>');
  if (p.flameBefore !== p.flameAfter) eff.push('<li>الشعلة: ' + flameLabel[p.before.flameKind] + ' ← ' + flameLabel[p.after.flameKind] + '</li>');
  if (p.after.freezes !== p.before.freezes) eff.push('<li>التجميدات: ' + N(p.before.freezes) + ' ← ' + N(p.after.freezes) + '</li>');
  const later = p.streakDelta || p.flameBefore !== p.flameAfter || p.after.freezes !== p.before.freezes;
  const ok = await confirmDlg({ title: 'تعديل يوم سابق', body: '<p><b>' + (delta > 0 ? 'هل أنت متأكدة أنك أنجزتِ هذه المهمة في هذا اليوم؟' : 'هل تريدين إلغاء تسجيل هذا الإنجاز؟') + '</b></p><p class="muted">«' + esc(name) + '» · ' + dlabel(D) + '</p><ul class="eff">' + eff.join('') + '</ul>' + (later ? '<div class="note warn">هذا التعديل يؤثر على أيام لاحقة (الاستمرارية أو التجميدات)، وتُعاد حساباتها تلقائيًا.</div>' : '') + '<div class="note">لا تتكرر المكافآت: تُحسب العملات من حالة الإنجاز الفعلية، فتسويتها واضحة هنا.</div>', ok: 'تأكيد التعديل' });
  if (!ok) return;
  act((s) => { E.setCount(s, id, D, next); E.logEdit(s, { date: D, taskId: id, taskName: name, from: cur, to: next, balanceDelta: p.diff.delta, streakDelta: p.streakDelta }); });
}

async function doBuy(k) {
  const price = E.itemPrice(ST, k);
  const names = { freeze: 'تجميدة الشعلة', bonus: 'بطاقة زيادة المكافأة', least: 'بطاقة أقل ما يمكن' };
  const ok = await confirmDlg({ title: 'شراء ' + names[k], body: '<p>السعر: ' + money(price) + '</p><p class="muted small">رصيدك بعد الشراء: ' + N(R.balance - price) + '</p>', ok: 'شراء' });
  if (!ok) return;
  const opId = 'buy-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
  const probe = E.clone(ST); const r = E.buy(probe, k, TODAY(), opId); if (!r.ok) { err(r.error); return; }
  act((s) => { E.buy(s, k, TODAY(), opId); });
  toast({ text: 'تم شراء ' + names[k] + ' بـ ' + N(price) + (k === 'bonus' ? '. فعّلتُها لك اليوم.' : k === 'least' ? '. حُفظت في قسم الاستمرارية.' : '.'), amount: 0 });
