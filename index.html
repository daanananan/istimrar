<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2C6A49"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="استمرّ"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><title>استمرّ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@700&family=Noto+Sans:wght@700&display=swap">
<style>
/* التصميم: غرفة نباتية دافئة بتدرجات الأخضر والكريمي، والشعلة هي نقطة اللون الوحيدة الحارّة */
:root {
  --bg:#EDF0E0; --surface:#F9FAF0; --surface2:#E2E8D2; --ink:#1D2A21; --ink2:#55655A; --line:#CBD3BA;
  --green:#2C6A49; --green-ink:#F4F8EC; --leaf:#86BE95; --gold:#B98A22; --danger:#B04636; --ice:#5FB5E6; --ice-bg:#DCEFF8;
  --flame:#F26A1B; --shadow:0 1px 0 rgba(30,50,35,.06),0 8px 24px -12px rgba(30,50,35,.25);
  --font-display:'IBM Plex Sans Arabic','Geeza Pro','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Geeza Pro','Segoe UI',system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0F1711; --surface:#18231B; --surface2:#213027; --ink:#E6EEDC; --ink2:#9BAF9F; --line:#2B3C30;
  --green:#7CCB98; --green-ink:#0E1A12; --leaf:#3F7A57; --gold:#E0B04A; --danger:#E27A6A; --ice:#7CC4E8; --ice-bg:#17303C;
  --flame:#FF8438; --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.7); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#0F1711; --surface:#18231B; --surface2:#213027; --ink:#E6EEDC; --ink2:#9BAF9F; --line:#2B3C30;
  --green:#7CCB98; --green-ink:#0E1A12; --leaf:#3F7A57; --gold:#E0B04A; --danger:#E27A6A; --ice:#7CC4E8; --ice-bg:#17303C;
  --flame:#FF8438; --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.7); color-scheme: dark; }

*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 96px;direction:rtl;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:700;text-wrap:balance}
.wrap{max-width:720px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums}

/* الرأس */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--font-display);font-size:26px;color:var(--green);letter-spacing:.5px;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font-weight:600;white-space:nowrap}
.chip svg{width:22px;height:28px}

/* التنقل */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;justify-content:center}
.nav button{flex:1;min-width:0;max-width:96px;white-space:nowrap;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--ink2);font-size:10.5px;position:relative}
@media (max-width:380px){.nav button{font-size:9.5px}}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--green);background:var(--surface2);font-weight:600}
.pfilters button.face{padding:3px 6px}
.dlist{display:flex;flex-direction:column;gap:8px}
.dent{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:start;color:var(--ink);width:100%}
.dface{flex:none;width:40px;height:40px}.dnone{display:block;width:40px;height:40px;border-radius:50%;border:2px dashed var(--line)}
.dbody{display:flex;flex-direction:column;gap:4px;min-width:0}.dmeta{font-size:12px;color:var(--ink2)}
.dtxt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.dedit{position:fixed;inset:0;z-index:65;background:var(--bg);display:flex;flex-direction:column}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;border-bottom:1px solid var(--line)}
.dsaved{font-size:12px;color:var(--green)}
.dscroll{flex:1;overflow:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.moodrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mood{background:var(--surface);border:2px solid transparent;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink2)}
.mood.on{border-color:var(--green);background:var(--surface2);color:var(--ink);font-weight:600}
.mood svg{width:100%;max-width:46px;height:auto}
.dwrap{min-height:55vh;background:transparent;border:0;padding:6px 2px;cursor:text}
.dpart{display:block;width:100%;min-height:0;border:0;padding:0;margin:0;background:transparent;line-height:2;font-size:18px;resize:none;overflow:hidden;outline:none;border-radius:0}

.atts{display:flex;flex-direction:column;gap:8px}
.att{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;overflow:hidden}
.att img,.att video{width:100%;max-height:60vh;object-fit:contain;display:block;border-radius:10px}
.att a{word-break:break-all;color:var(--green)}
.adel{position:absolute;top:6px;inset-inline-start:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:1}
.att.link,.att.file{padding-inline-start:44px;padding-block:12px}
.todcard{border-radius:20px;padding:12px 12px 6px;border:1px solid var(--line)}
.todcard .todh{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.todcard .todh svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tod-morning{background:color-mix(in srgb,#F6C177 20%,var(--bg))}.tod-morning .todh svg{color:#D9962B}
.tod-noon{background:color-mix(in srgb,#9CC7EE 20%,var(--bg))}.tod-noon .todh svg{color:#4C95D1}
.tod-night{background:color-mix(in srgb,#8E86C8 20%,var(--bg))}.tod-night .todh svg{color:#8E86C8}
.tod-any{background:var(--surface)}
.calseg{display:flex;gap:8px;justify-content:space-between;align-items:center}
.cal{display:grid;gap:4px;direction:rtl}
.cal.m{grid-template-columns:repeat(7,1fr);gap:6px}
.cal.y{grid-template-columns:repeat(var(--c,18),1fr);gap:3px}
.sq{aspect-ratio:1;border-radius:7px;border:0;padding:0;background:var(--surface2);color:var(--ink);font-size:13px;font-weight:600;display:grid;place-items:center;position:relative;min-height:0;min-width:0}
.cal.y .sq{border-radius:4px;font-size:0}
.sq.hd{background:none;aspect-ratio:auto;font-size:11px;color:var(--ink2);font-weight:500}
.sq.fut{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink2)}
.sq.s1{background:color-mix(in srgb,var(--green) 40%,var(--bg));color:var(--ink)}
.sq.s2{background:color-mix(in srgb,var(--green) 70%,var(--bg));color:#fff}
.sq.s3{background:var(--green);color:var(--green-ink)}
.sq.qt{background:color-mix(in srgb,var(--leaf) 16%,var(--bg));border:1.5px dashed var(--leaf)}
.sq.fz{background:var(--ice-bg);color:var(--ice);border:1.5px solid var(--ice)}
.sq.ot{background:color-mix(in srgb,var(--danger) 70%,var(--bg));color:#fff}
.sq.rs{background:color-mix(in srgb,var(--gold) 55%,var(--bg));color:var(--ink)}
.sq.id{background:transparent;border:1.5px dashed var(--line);color:var(--ink2)}
.sq.td{outline:2.5px solid var(--ink);outline-offset:1px}
.cal.y .sq.td{outline-width:2px}
.sq .nd{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.cal.y .sq .nd{display:none}
.callegend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2)}
.callegend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-inline-end:4px}
.hopesky{background:linear-gradient(180deg,#0E1B33,#1B2A4A 60%,#27385E);border-radius:20px;color:#EAF0FF;padding:14px;position:relative;overflow:hidden}
.hopesky h3,.hopesky .small{color:#EAF0FF}
.hopesky .muted{color:#AEBBDD}
.hopesky svg.sky{width:100%;height:auto;display:block;max-height:300px}
.hopesky .st{transition:opacity .4s}
.hopesky.cloudy svg.sky .lit{opacity:.38;filter:grayscale(.6)}
.hopesky.cloudy::after{content:"";position:absolute;inset:auto 0 40% 0;height:70px;background:radial-gradient(ellipse at 30% 50%,rgba(220,228,245,.28),transparent 60%),radial-gradient(ellipse at 75% 40%,rgba(220,228,245,.22),transparent 60%);pointer-events:none}
@keyframes twk{0%,100%{opacity:1}50%{opacity:.45}}
.hopesky .today-star{animation:twk 2.4s ease-in-out infinite}
.hopesky .btn.soft{background:rgba(255,255,255,.12);color:#EAF0FF}
.hopesky .btn.ghost{color:#EAF0FF;border-color:rgba(255,255,255,.5)}
.hbadge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:rgba(255,255,255,.14)}
.hdisc{display:flex;flex-wrap:wrap;gap:6px}
.hdisc span{font-size:12px;border-radius:12px;padding:4px 10px;background:rgba(255,255,255,.08);color:#AEBBDD}
.hdisc span.on{background:rgba(255,211,78,.18);color:#FFE7A0}
.arch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.arch .a{background:rgba(255,255,255,.07);border-radius:14px;padding:6px;text-align:center;font-size:11px;color:#AEBBDD}
.stat{position:fixed;inset:0;z-index:65;background:var(--bg);display:flex;flex-direction:column}
.stbody{flex:1;overflow:auto;padding:12px 14px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sttabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.sttabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 4px;color:var(--ink2);font-weight:600}
.sttabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--flame)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stile .k{font-size:12px;color:var(--ink2);font-weight:600}
.stile .v{font-size:30px;font-weight:700;line-height:1.1}.stile .v small{font-size:14px;font-weight:500;color:var(--ink2)}
.stile .s{font-size:12px;color:var(--ink2)}
.stile.hero{grid-column:1/-1;background:color-mix(in srgb,var(--flame) 14%,var(--surface))}
.sbars{display:flex;gap:4px;align-items:flex-end;height:46px}
.sbars i{flex:1;background:color-mix(in srgb,var(--green) 70%,transparent);border-radius:4px;min-height:3px}
.sbars i.hi{background:var(--flame)}
.sbarl{display:flex;gap:4px;font-size:11px;color:var(--ink2)}.sbarl span{flex:1;text-align:center}
.tipcard{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.7}
.tipcard button{background:none;border:0;color:var(--ink2);font-size:18px;line-height:1;padding:0 4px;margin-inline-start:auto}
.hstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hstats div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.hstats b{font-size:26px;line-height:1.1}.hstats span{font-size:12px;color:#AEBBDD}
.menubtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.menubtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.drawer-scrim{position:fixed;inset:0;z-index:70;background:rgba(10,20,14,.5);animation:fade .2s}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(78vw,300px);background:var(--bg);z-index:71;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 30px rgba(0,0,0,.3);animation:slidein .22s}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
.drawer button.di{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;color:var(--ink);font-size:16px;text-align:start}
.drawer button.di svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .soon::after{content:"";position:absolute;top:6px;inset-inline-end:22%;width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* بطاقات */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.sec-title{font-size:18px;margin-block:6px 2px;color:var(--green)}
.btn{background:var(--green);color:var(--green-ink);border:0;border-radius:12px;padding:10px 18px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.danger{background:var(--danger);color:#fff}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2)}
.pill.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.pill.warn{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.pill.ice{background:var(--ice-bg);color:var(--ice)}

/* الأيام */
.daynav{display:flex;align-items:center;gap:8px;margin-block:4px 10px}
.daynav h2{flex:1;font-size:20px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary .card{padding:12px 14px}
.summary b{display:block;font-size:13px;color:var(--ink2);font-weight:500}
.summary span{font-weight:600}

/* مهام */
.tasklist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0;transition:opacity .25s,background .25s}
.task.done{opacity:.62;background:var(--surface2)}
.emo{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:2px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.tbody{flex:1;min-width:0}
.tname{font-weight:600;overflow-wrap:anywhere}
.task.done .tname{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--green)}
.acts{display:flex;gap:6px;align-items:center}
.circ{width:46px;height:46px;border-radius:50%;border:2px solid var(--green);background:transparent;color:var(--green);display:grid;place-items:center;transition:transform .15s,background .2s}
.circ:active{transform:scale(.92)}
.circ svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.circ.on{background:var(--green);color:var(--green-ink)}
.circ.mini{width:34px;height:34px;border-width:1.5px;border-color:var(--line);color:var(--ink2)}
.circ.mini svg{width:16px;height:16px}
.circ[disabled]{opacity:.35;cursor:not-allowed}
.edit{background:none;border:0;color:var(--ink2);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.edit svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;height:54px;padding-inline:20px;border-radius:999px;box-shadow:var(--shadow);font-size:16px}

/* الشعلة */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-block:20px}
.hero .big{width:170px;height:210px}
.streaknum{font-family:var(--font-display);font-size:56px;line-height:1;color:var(--flame)}
.hero.s-frozen .streaknum,.hero.s-out .streaknum{color:var(--ink2)}
.hero.s-frozen .streaknum{color:var(--ice)}
.flameg{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
.flameg.b{animation-duration:1.1s}
.flameg.inner{animation-duration:1.2s;animation-delay:-.4s}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.97,1.05) skewX(-2deg)}60%{transform:scale(1.02,.97) skewX(1.5deg)}}
.smoke{animation:rise 3s ease-in infinite;opacity:0}
.smoke.d2{animation-delay:1.2s}
@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.5}100%{transform:translateY(-34px);opacity:0}}
.spark{animation:spark 2s ease-out infinite;opacity:0}
.spark.d2{animation-delay:.7s}.spark.d3{animation-delay:1.3s}
@keyframes spark{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.glow{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--flame) 70%,transparent))}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink2)}
.wd .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:2px solid transparent}
.wd .dot svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.wd .dot.success{background:color-mix(in srgb,var(--flame) 22%,transparent);color:var(--flame)}
.wd .dot.frozenSave,.wd .dot.freezeStart,.wd .dot.frozenDay{background:var(--ice-bg);color:var(--ice)}
.wd .dot.out{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.wd .dot.quiet{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.wd .dot.restored{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.wd .dot.today{border-color:var(--green)}
.wd .perfect{color:var(--gold);font-size:10px;font-weight:600;min-height:14px}
.charts svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* السوق */
.tabs{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:600;color:var(--ink2);min-height:40px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--green);box-shadow:var(--shadow)}
.balance{display:flex;align-items:center;justify-content:space-between;gap:10px}
.money{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}
.sar{display:inline-block;color:var(--gold);font-weight:700;line-height:1;white-space:nowrap}
.sar-g{font-family:'Noto Sans','Noto Sans Arabic','SF Arabic','Geeza Pro','Segoe UI',system-ui,sans-serif}
.sar-fb{display:none;width:.82em;height:.95em;vertical-align:-.12em;fill:none;stroke:currentColor;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
html.no-sar .sar-g{display:none}
html.no-sar .sar-fb{display:inline-block}
.bigmoney{font-family:var(--font-display);font-size:34px;color:var(--gold)}
.item{display:flex;gap:14px;align-items:flex-start}
.item .ico{flex:none;width:56px;height:56px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;color:var(--green)}
.item .ico svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.item .info{flex:1;min-width:0}
.item h3{font-size:18px}

/* نماذج */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(10,20,14,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:22px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl{font-weight:600;font-size:14px}
input[type=text],input[type=email],input[type=number],input[type=date],textarea,select{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:84px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--bg));color:var(--green)}
.seg button[disabled]{opacity:.4}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);font-size:12px;font-weight:600}
.daychips button[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;max-height:130px;overflow:auto;padding:4px;background:var(--bg);border-radius:12px}
.emojis button{background:none;border:0;font-size:22px;border-radius:8px;height:40px}
.emojis button:hover{background:var(--surface2)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper output{min-width:32px;text-align:center;font-weight:700;font-size:18px}
.actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.actions .btn{flex:1}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink2)}
.note.warn{background:color-mix(in srgb,var(--gold) 16%,var(--surface));color:var(--ink)}
.eff{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;direction:ltr;text-align:left;min-height:120px}

/* إشعارات */
.toasts{position:fixed;inset-inline:16px;top:calc(64px + env(safe-area-inset-top,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;max-width:480px;width:100%;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);animation:pop .3s cubic-bezier(.2,1.3,.4,1);font-size:14px}
.toast.out{animation:gone .3s forwards}
.toast b{font-weight:700}
.toast .bal{opacity:.7;font-size:12px}
.toast.err{background:var(--danger);color:#fff}
@keyframes pop{from{transform:translateY(-14px) scale(.96);opacity:0}}
@keyframes gone{to{transform:translateY(-10px);opacity:0}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}
.cele{text-align:center}
.cele .flamebox{width:150px;height:190px;margin:0 auto}
.cele h2{font-size:28px;color:var(--flame)}

/* حالات الواجهة */
#frost,#dim{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;transition:opacity .8s}
#frost{background:
  radial-gradient(120% 60% at 50% -10%,rgba(190,235,255,.85),transparent 55%),
  radial-gradient(120% 60% at 50% 110%,rgba(190,235,255,.8),transparent 55%),
  radial-gradient(50% 120% at -10% 50%,rgba(200,240,255,.8),transparent 55%),
  radial-gradient(50% 120% at 110% 50%,rgba(200,240,255,.8),transparent 55%),
  repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.07) 0 6deg,transparent 6deg 12deg)}
#dim{background:rgba(5,10,8,.42)}
body.is-frozen #frost{opacity:.9}
body.is-out #dim{opacity:1}
body.is-frozen .card,body.is-frozen .task{border-color:var(--ice)}
body.is-lantern{--bg:#EFEBD6}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- الشخصية ---------- */
.stage{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/3.4;max-height:430px;margin-inline:auto;width:100%;border:1px solid var(--line)}
.stage .room,.stage .char,.stage .fxlayer,.stage .fx,.stage .rays{position:absolute;inset:0;width:100%;height:100%}
.stage .char{inset:auto;left:50%;transform:translateX(-50%);bottom:0;height:auto;width:96%}
.char .breath{transform-origin:120px 300px;animation:breath 3.4s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
.plant .sway{transform-box:view-box;transform-origin:100px 168px;animation:swayp 5s ease-in-out infinite}
@keyframes swayp{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.plant .orbit{transform-box:view-box;transform-origin:100px 120px;animation:orbitp 14s linear infinite}
@keyframes orbitp{to{transform:rotate(360deg)}}
.plant .twk,.plant .aura{transform-box:fill-box;transform-origin:center}
.ptile .plant,.stage .plant,.sheet .plant,.scrim .plant{overflow:visible;display:block;width:100%;height:auto}
@media (prefers-reduced-motion:reduce){.plant .sway,.plant .orbit{animation:none}}
.proom{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(var(--wall,color-mix(in srgb,var(--leaf) 26%,var(--surface))) 0 62%,var(--floor,color-mix(in srgb,var(--gold) 34%,var(--surface2))) 62% 100%);padding:14px 10px 10px}
.proom .decor{display:flex;justify-content:space-between;align-items:flex-end;height:46px;margin:0 6px 4px;pointer-events:none}
.proom .decor svg{height:46px;width:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ptile{position:relative;background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--line);border-radius:14px;padding:8px 8px 10px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.ptile .art{padding:6px 14px 0}
.ptile h4{margin:2px 0 4px;font-size:14px}
.hearts{letter-spacing:2px;color:#D4473B;font-size:15px}
.hearts .off{color:var(--line)}
.pbar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:4px 0}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px}
.ptile.wet::after{content:"";position:absolute;inset:0;border-radius:14px;background:repeating-linear-gradient(100deg,transparent 0 9px,color-mix(in srgb,var(--ice) 55%,transparent) 9px 11px);animation:rainp 1.1s linear 2;opacity:0;pointer-events:none}
@keyframes rainp{0%{opacity:0;background-position:0 -30px}30%{opacity:.9}100%{opacity:0;background-position:0 40px}}
.bucketfly{position:fixed;top:90px;inset-inline-start:-80px;width:72px;z-index:60;pointer-events:none;animation:flyb 2.4s ease-in-out forwards}
@keyframes flyb{0%{transform:translateX(0) rotate(0)}15%{transform:translateX(30vw) rotate(-35deg)}85%{transform:translateX(88vw) rotate(-35deg)}100%{transform:translateX(100vw) rotate(0)}}
html[dir=rtl] .bucketfly{animation-name:flybr}
@keyframes flybr{0%{transform:translateX(0) rotate(0)}15%{transform:translateX(-30vw) rotate(35deg)}85%{transform:translateX(-88vw) rotate(35deg)}100%{transform:translateX(-100vw) rotate(0)}}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.ach{display:flex;gap:12px;align-items:center;padding:12px}
.ach .aico{width:74px;flex:none}
.ach .achico{width:100%;height:auto;display:block}
.ach.locked .achico{filter:grayscale(1) contrast(.85);opacity:.5}
.ach.locked b{color:var(--ink2)}
.hart{max-width:520px;margin:0 auto;width:100%}
.hart .house{display:block;width:100%;height:auto}
.house{pointer-events:none}.house .plant{pointer-events:auto}
.hcard .pgrid{margin-top:4px}
.pfilters{display:flex;gap:6px;flex-wrap:wrap}
.pfilters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;color:var(--ink2);min-height:36px}
.pfilters button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.char .unib{transform-box:fill-box;transform-origin:15% 100%;animation:unib 3.2s ease-in-out infinite}
@keyframes unib{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,1.035)}}
.char.mv2 .unib,.char .unib.rear{animation:rear 2.4s ease-in-out}
@keyframes rear{0%{transform:rotate(0)}30%{transform:rotate(-26deg)}60%{transform:rotate(-26deg)}100%{transform:rotate(0)}}
.char .uniwing{transform-box:fill-box;transform-origin:80% 90%;animation:uwing 2.6s ease-in-out infinite}
@keyframes uwing{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.char .tail{transform-box:fill-box;transform-origin:10% 85%;animation:tailw 2.6s ease-in-out infinite}
@keyframes tailw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}
.char .wing{transform-box:fill-box;transform-origin:50% 60%}
.char[data-o=n3] .wing{animation:wingf 3.6s ease-in-out infinite}
@keyframes wingf{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
.char .wpnw,.char .arm-r{transform-box:fill-box}
.char .wpnw{transform-origin:50% 92%}
.char.mv1[data-o=n1] .wpnw{animation:thrust 2.2s ease-in-out}
@keyframes thrust{0%{transform:rotate(0)}25%{transform:rotate(-34deg) translateY(-4px)}45%{transform:rotate(14deg) translateY(-14px)}65%{transform:rotate(14deg) translateY(-14px)}100%{transform:rotate(0)}}
.char.mv1[data-o=n1] .cape{animation:capeb 2.2s ease-in-out}
@keyframes capeb{0%,100%{transform:skewX(0)}40%{transform:skewX(7deg) scale(1.03)}}
.char.mv1[data-o=n2] .arm-r{transform-origin:20% 15%;animation:lick 2.4s ease-in-out}
@keyframes lick{0%{transform:translate(0,0) rotate(0)}30%{transform:translate(-14px,-66px) rotate(-34deg)}40%{transform:translate(-16px,-68px) rotate(-26deg)}50%{transform:translate(-14px,-66px) rotate(-38deg)}60%{transform:translate(-16px,-68px) rotate(-26deg)}100%{transform:translate(0,0) rotate(0)}}
.char.mv1[data-o=n2] .breath{animation:breath 3.4s ease-in-out infinite,tilt 2.4s ease-in-out}
@keyframes tilt{0%,100%{rotate:0deg}35%,60%{rotate:-2.5deg}}
.char.mv1[data-o=n3] .wpnw{animation:wand 2.4s ease-in-out}
@keyframes wand{0%{transform:rotate(0)}30%{transform:rotate(-28deg) translateY(-12px)}55%{transform:rotate(-28deg) translateY(-12px) scale(1.06)}100%{transform:rotate(0)}}
.char.mv1[data-o=n3] .aura{animation:aurap 2.4s ease-out}

/* حركات إضافية للأزياء الثلاثة */
.char .sring,.char .lring,.char .slash,.char .heart,.char .burst,.char .shield,.char .lasso{transform-box:fill-box;transform-origin:center}
.char .sring,.char .lring,.char .slash,.char .heart,.char .burst{opacity:0}
.char.mv2[data-o=n1] .arm-r{transform-origin:20% 12%;animation:blockn 2.2s ease-in-out}
@keyframes blockn{0%,100%{transform:translate(0,0) rotate(0)}30%,65%{transform:translate(-40px,-34px) rotate(-12deg) scale(1.12)}}
.char.mv2[data-o=n1] .sring{animation:sringa 2.2s ease-out}
@keyframes sringa{0%{opacity:0;transform:scale(.6)}35%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(2.3)}}
.char.mv3[data-o=n1] .lring{animation:lringa 2.6s ease-in-out}
@keyframes lringa{0%{opacity:0;transform:scale(.55) rotate(0);stroke-dashoffset:0}25%{opacity:1}75%{opacity:1}100%{opacity:0;transform:scale(1.2) rotate(8deg);stroke-dashoffset:-120}}
.char.mv3[data-o=n1] .lasso{transform-origin:50% 0;animation:lassow 2.6s ease-in-out}
@keyframes lassow{0%,100%{transform:translate(104px,298px) rotate(0)}30%{transform:translate(104px,298px) rotate(-24deg) scale(1.15)}60%{transform:translate(104px,298px) rotate(20deg) scale(1.15)}}
.char.mv3[data-o=n1] .breath{animation:breath 3.4s ease-in-out infinite,spinj 2.6s ease-in-out}
@keyframes spinj{0%,100%{translate:0 0}25%{translate:0 -12px}50%{translate:0 0}}
.char.mv2[data-o=n2] .breath{animation:breath 3.4s ease-in-out infinite,pounce 2.2s ease-in-out}
@keyframes pounce{0%,100%{translate:0 0}28%{translate:-4px -30px}52%{translate:10px 6px}70%{translate:0 0}}
.char.mv2[data-o=n2] .arm-r{transform-origin:20% 15%;animation:swipe 2.2s ease-in-out}
@keyframes swipe{0%,100%{transform:rotate(0)}30%{transform:rotate(-60deg) translate(-6px,-10px)}52%{transform:rotate(26deg)}}
.char.mv2[data-o=n2] .slash{stroke-dasharray:90;animation:slashd 2.2s ease-out}
@keyframes slashd{0%,45%{opacity:0;stroke-dashoffset:90}55%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:-30}}
.char.mv3[data-o=n2] .heart{animation:heartup 2.4s ease-out}
@keyframes heartup{0%{opacity:0;transform:translateY(8px) scale(.4)}30%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-34px) scale(1)}}
.char.mv3[data-o=n2] .tail{animation:tailw .45s ease-in-out 5}
.char.mv3[data-o=n2] .breath{animation:breath 3.4s ease-in-out infinite,tilt 2.4s ease-in-out}
.char.mv3[data-o=n3] .burst{animation:burstb 2.4s ease-out}
@keyframes burstb{0%{opacity:0;transform:scale(.4) rotate(0)}30%{opacity:1}100%{opacity:0;transform:scale(1.25) rotate(80deg)}}
.char.mv3[data-o=n3] .wpnw{animation:wand 2.4s ease-in-out}
.char.mv3[data-o=n3] .unib{animation:rear 2.4s ease-in-out}
.char .sk1,.char .sk2,.char .sk3{transform-box:fill-box;transform-origin:50% 0}
.char .sk1{animation:sks 4.2s ease-in-out infinite}.char .sk2{animation:sks 3.4s ease-in-out infinite reverse}.char .sk3{animation:sks 2.8s ease-in-out infinite}
@keyframes sks{0%,100%{transform:skewX(-1.6deg) scaleX(1)}50%{transform:skewX(1.6deg) scaleX(1.025)}}
.char.mv1[data-o=n3] .sk1,.char.mv2[data-o=n3] .sk1,.char.mv3[data-o=n3] .sk1{animation:skw 2.4s ease-in-out}
@keyframes skw{0%,100%{transform:skewX(0) scaleX(1)}35%,60%{transform:skewX(-5deg) scaleX(1.1)}}

.supcard{background:color-mix(in srgb,var(--ice) 14%,var(--surface))}.whyq{margin:8px 0 0;font-weight:600;line-height:1.6}
.flamenote{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.goalcard .bar i{background:var(--gold)}
.wrcard .wrline{margin:3px 0}
.cheer{position:fixed;bottom:92px;inset-inline:0;margin-inline:auto;width:fit-content;max-width:80%;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.14);z-index:70;animation:pop .25s ease-out;pointer-events:none}
.breath-wrap{display:grid;place-items:center;height:150px;position:relative}.breathc{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#FFE7A0,#F4B95A);animation:brth 8s ease-in-out infinite;opacity:.9}
@keyframes brth{0%,100%{transform:scale(.7)}50%{transform:scale(1.7)}}
.breath-t{position:absolute;font-weight:700;color:#5a3d00}.hnotes{margin:4px 0}
.say{position:absolute;top:30%;inset-inline-start:5%;max-width:46%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.14);z-index:3;animation:pop .25s ease-out;pointer-events:none}
@keyframes aurap{0%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}100%{opacity:.6;transform:scale(1)}}
.char .aura{transform-box:fill-box;transform-origin:center}
.char.mv2[data-o=n3] .wing{animation:wingspread 2.4s ease-in-out}
@keyframes wingspread{0%{transform:scale(1,1)}35%,60%{transform:scale(1.28,1.2)}100%{transform:scale(1,1)}}
.char.mv2[data-o=n3] .breath{animation:breath 3.4s ease-in-out infinite,floatu 2.4s ease-in-out}
@keyframes floatu{0%,100%{translate:0 0}40%,60%{translate:0 -14px}}
@media (prefers-reduced-motion:reduce){.char *{animation:none!important}}
.char .twk{animation:twk 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twk{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.char .aura{animation:aura 3s ease-in-out infinite}
@keyframes aura{0%,100%{opacity:.6}50%{opacity:1}}
.char .cape{transform-origin:120px 172px;animation:cape 4s ease-in-out infinite}
@keyframes cape{0%,100%{transform:skewX(0)}50%{transform:skewX(2.2deg)}}
.fx *{transform-box:fill-box;transform-origin:center;fill:none}

.fx .sparkle{animation:spk 1.5s ease-out both}
@keyframes spk{from{transform:scale(0) rotate(0);opacity:1}60%{opacity:1}to{transform:scale(1.6) rotate(90deg);opacity:0}}
.fx .shield[fill]:not([fill="none"]){fill-opacity:.25}
.stage .rays{opacity:0;background:repeating-conic-gradient(from 0deg at 50% 62%,color-mix(in srgb,var(--gold) 45%,transparent) 0 6deg,transparent 6deg 18deg);z-index:0;pointer-events:none}
.stage.heroic .rays{animation:rays 2.8s ease-out}
@keyframes rays{0%{opacity:0;transform:rotate(0)}20%{opacity:.9}100%{opacity:0;transform:rotate(40deg)}}
.stage.heroic .char{animation:hero 2.8s ease-in-out}
@keyframes hero{0%{transform:translateX(-50%) translateY(0)}20%{transform:translateX(-50%) translateY(-34px)}35%{transform:translateX(-50%) translateY(0)}55%{transform:translateX(-50%) translateY(-18px)}70%,100%{transform:translateX(-50%) translateY(0)}}
.stage.heroic .arm-r{animation:arm 2.8s ease-in-out;transform-box:fill-box;transform-origin:20% 10%}

    if (f.remind !== undefined) t.remind = /^([01]\d|2[0-3]):[0-5]\d$/.test(f.remind || '') ? f.remind : '';
    const same = t.versions.findIndex((x) => x.from === today);
    if (same >= 0) t.versions[same] = v; else t.versions.push(v);
    normalizeAllowance(st, today);
    return { ok: true };
  }

  function deleteTask(st, id, today) {
    const t = st.tasks.find((x) => x.id === id);
    if (!t) return { ok: false };
    t.deletedDate = today;
    normalizeAllowance(st, today);
    return { ok: true };
  }

  // إذا قلّ عدد المهام وتجاوز المستثنى الحد، تعود الأقدم لتكون مسؤولة
  function normalizeAllowance(st, today) {
    let guard = 50;
    while (guard-- > 0) {
      const al = allowance(st, today, 0);
      if (al.used <= al.max) return;
      const ex = st.tasks.find((t) => isActive(t, today) && isMainLike(ver(t, today)) && !ver(t, today).streak);
      if (!ex) return;
      const v = Object.assign({}, ver(ex, today), { from: today, streak: true });
      const same = ex.versions.findIndex((x) => x.from === today);
      if (same >= 0) ex.versions[same] = v; else ex.versions.push(v);
    }
  }

  /* ---------- الإنجازات ---------- */
  function setCount(st, taskId, D, count, ts) {
    const cur = st.completions.filter((c) => c.taskId === taskId && c.date === D);
    if (count > cur.length) {
      for (let i = cur.length; i < count; i++) st.completions.push({ id: nid(st, 'c'), taskId, date: D, ts: ts || Date.now() });
    } else if (count < cur.length) {
      const drop = new Set(cur.slice(count).map((c) => c.id));
      st.completions = st.completions.filter((c) => !drop.has(c.id));
    }
  }
  const countOf = (st, taskId, D) => st.completions.filter((c) => c.taskId === taskId && c.date === D).length;

  /* ---------- الفهرس والنموذج اليومي ---------- */
  function buildIndex(st) {
    const m = new Map();
    for (const c of st.completions) { const k = c.taskId + '|' + c.date; m.set(k, (m.get(k) || 0) + 1); }
    const comp = new Map();
    for (const c of st.compDone) { const s = comp.get(c.date) || new Set(); s.add(c.step); comp.set(c.date, s); }
    const ws = st.settings.weekStart;
    return {
      c: (id, D) => m.get(id + '|' + D) || 0,
      weekBefore: (id, D) => { let s = 0; for (let d = weekStart(D, ws); d < D; d = addDays(d, 1)) s += m.get(id + '|' + d) || 0; return s; },
      weekIncl: (id, D) => { let s = 0; const e = addDays(weekStart(D, ws), 6); for (let d = weekStart(D, ws); d <= e; d = addDays(d, 1)) s += m.get(id + '|' + d) || 0; return s; },
      comp: (D) => comp.get(D) || new Set(),
    };
  }

  const compNeeded = (st) => (st.settings.compMode === 'sequence' ? Math.max(1, st.settings.compSteps.length) : 1);
  const compSteps = (st) => {
    const list = st.settings.compSteps.filter(Boolean);
    if (!list.length) return ['المهمة التعويضية: أنجزي ما حدّدتِه لنفسك لإعادة الشعلة'];
    return st.settings.compMode === 'sequence' ? list : [list[0]];
  };
  function compComplete(st, ix, D) {
    const need = compNeeded(st); const s = ix.comp(D);
    for (let i = 0; i < need; i++) if (!s.has(i)) return false;
    return true;
  }

  function taskHistory(st, taskId, today) {
    const t = st.tasks.find((x) => x.id === taskId); if (!t) return [];
    const ix = buildIndex(st); const out = [];
    for (let D = t.createdDate; D <= today; D = addDays(D, 1)) {
      if (t.deletedDate && D >= t.deletedDate) break;
      const quiet = st.quiet.includes(D);
      const m = dayModel(st, D, ix); const it = m.items.find((i) => i.task.id === taskId); if (!it) continue;
      const opt = it.kind === 'weeklyOpt';
      out.push({ D, done: it.done, target: it.target, complete: it.complete, quiet, optional: opt && !it.complete });
    }
    return out;
  }


  // مراجعة آخر سبعة أيام: أيام النجاح، أفضل يوم، أكثر مهمة التزامًا، والعملات المكتسبة
  function weekReview(st, r, today) {
    const from = addDays(today, -6); const days = []; for (let D = from; D <= today; D = addDays(D, 1)) if (r.days[D]) days.push(Object.assign({ D }, r.days[D]));
    const succ = days.filter((d) => d.status === 'success').length;
    let best = null; days.forEach((d) => { if (d.ticks > 0 && (!best || d.ticks > best.ticks)) best = d; });
    const cnt = {}; st.completions.forEach((c) => { if (c.date >= from && c.date <= today) cnt[c.taskId] = (cnt[c.taskId] || 0) + 1; });
    let top = null; Object.keys(cnt).forEach((id) => { if (!top || cnt[id] > top.count) { const t = st.tasks.find((x) => x.id === id); if (t) top = { id, count: cnt[id], name: (ver(t, today) || t.versions[t.versions.length - 1]).name, emoji: t.emoji }; } });
    const earned = r.ledger.filter((x) => x.amount > 0 && x.date >= from && x.date <= today).reduce((a, x) => a + x.amount, 0);
    return { from, to: today, succ, tracked: days.length, bestDay: best ? best.D : null, bestTicks: best ? best.ticks : 0, top, earned, goal: C.WEEK_GOAL };
  }
  // تقدّم هدف الأسبوع الحالي
  function weekGoal(st, r, today) {
    const ws = weekStart(today, st.settings.weekStart); let n = 0; for (let D = ws; D <= today; D = addDays(D, 1)) if (r.days[D] && r.days[D].status === 'success') n++;
    return { start: ws, done: n, goal: C.WEEK_GOAL, reached: n >= C.WEEK_GOAL, reward: C.WEEK_GOAL_REWARD, on: !!(st.settings.extrasFrom && today >= st.settings.extrasFrom) };
  }

  function dayModel(st, D, ix) {
    const ws = st.settings.weekStart;
    const quiet = st.quiet.includes(D);
    const lu = st.leastUses.find((u) => u.date === D) || null;
    const items = [];
    for (const t of st.tasks) {
      if (!isActive(t, D)) continue;
      const v = ver(t, D); if (!v) continue;
      const done = ix.c(t.id, D);
      let kind, target = v.target, converted = false, weekDone = 0, weekTarget = 0, before = 0;
      if (v.kind === 'main' || v.kind === 'side') {
        if (v.days && !v.days.includes(dow(D))) continue;
        kind = v.kind;
      } else if (v.weeklyMode === 'days') {
        if (!(v.days || []).includes(dow(D))) continue;
        kind = 'main';
      } else {
        weekTarget = v.weeklyCount; before = ix.weekBefore(t.id, D); weekDone = ix.weekIncl(t.id, D);
        target = 1;
        const rem = weekTarget - before;
        if (rem > 0 && rem >= daysLeftInWeek(D, ws)) { kind = 'main'; converted = true; } else kind = 'weeklyOpt';
      }
      items.push({ task: t, v, kind, target, done, complete: done >= target, converted, weekDone, weekTarget, before, streakResp: kind === 'main' && !!v.streak });
    }
    const mains = items.filter((i) => i.kind === 'main');
    const sides = items.filter((i) => i.kind === 'side');
    const weeklyOpts = items.filter((i) => i.kind === 'weeklyOpt');
    let reqMain = mains, reqStreak = mains.filter((i) => i.streakResp);
    if (lu) {
      reqMain = mains.filter((i) => lu.taskIds.includes(i.task.id));
      reqStreak = reqMain; // مع بطاقة «أقل ما يمكن» يكفي إنجاز الجزء المختار
    }
    for (const i of mains) i.required = reqMain.includes(i);
    const allMainDone = reqMain.length > 0 && reqMain.every((i) => i.complete);
    const allSideDone = sides.length > 0 && sides.every((i) => i.complete);
    return { D, quiet, lu, items, mains, sides, weeklyOpts, reqMain, reqStreak, allMainDone, allSideDone, hasStreak: reqStreak.length > 0, streakDone: reqStreak.length > 0 && reqStreak.every((i) => i.complete) };
  }

  /* ---------- المكافآت ---------- */
  const mainBonus = (n) => (n < 4 ? 4 : n <= 7 ? 6 : 10);
  const sideBonus = (n) => (n <= 4 ? 6 : 10);

  // السلفة: يُضاف المبلغ فورًا، ثم تُخصم نسبة ثابتة من كل مكافأة تأتي بعد يوم الاستلام حتى السداد
  function computeLoans(st, ledger) {
    const loans = (st.loans || []).slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.ts - b.ts)).map((l) => ({ id: l.id, date: l.date, amount: l.amount, left: l.amount, repaid: 0, doneDate: null }));
    const ent = ledger.map((e, i) => ({ e, i })).filter((x) => x.e.amount > 0).sort((a, b) => (a.e.date < b.e.date ? -1 : a.e.date > b.e.date ? 1 : a.i - b.i));
    const pays = [];
    for (const x of ent) {
      const L = loans.find((l) => l.left > 0 && l.date < x.e.date); if (!L) continue;
      const d = Math.min(L.left, Math.ceil(x.e.amount * C.LOAN_RATE), x.e.amount);
      if (d <= 0) continue; L.left -= d; L.repaid += d; if (L.left === 0) L.doneDate = x.e.date; pays.push({ loan: L.id, key: x.e.key, amount: d, date: x.e.date });
    }
    return { loans, pays, borrowed: loans.reduce((a, l) => a + l.amount, 0), repaid: loans.reduce((a, l) => a + l.repaid, 0), active: loans.find((l) => l.left > 0) || null };
  }

  function dayRewards(st, m) {
    const out = [];
    const bonusActive = st.purchases.some((p) => p.kind === 'bonus' && p.date === m.D);
    const extra = bonusActive ? C.BONUS_CARD_EXTRA : 0;
    for (const i of m.items) {
      const name = '«' + i.v.name + '»';
      if (i.kind === 'weeklyOpt') {
        if (i.done >= 1 && i.before + 1 <= i.weekTarget) out.push({ key: 'wk:' + i.task.id + ':' + m.D, amount: C.REWARD_MAIN + extra, reason: 'إنجاز مهمة أسبوعية ' + name, date: m.D });
        continue;
      }
      if (!i.complete) continue;
      const base = i.kind === 'side' ? C.REWARD_SIDE : C.REWARD_MAIN;
      out.push({ key: 'task:' + i.task.id + ':' + m.D, amount: base + extra, reason: (i.kind === 'side' ? 'إنجاز مهمة جانبية ' : 'إنجاز مهمة رئيسية ') + name + (extra ? ' (مع بطاقة زيادة المكافأة)' : ''), date: m.D });
    }
    if (m.allMainDone) out.push({ key: 'allMain:' + m.D, amount: mainBonus(m.reqMain.length), reason: 'إكمال جميع المهام الرئيسية (' + m.reqMain.length + ')', date: m.D });
    if (m.allSideDone) out.push({ key: 'allSide:' + m.D, amount: sideBonus(m.sides.length), reason: 'إكمال جميع المهام الجانبية (' + m.sides.length + ')', date: m.D });
    return out;
  }

  // نقاط التطوير: تُمنح بنفس شرط مكافأة المهمة (اكتمال العدد المطلوب)، وقيمتها من ١ إلى ٣ حسب المهمة
  function dayPoints(st, m) {
    const out = [];
    for (const i of m.items) {
      const name = '«' + i.v.name + '»'; const dev = i.v.dev || 1;
      if (i.kind === 'weeklyOpt') { if (i.done >= 1 && i.before + 1 <= i.weekTarget) out.push({ key: 'dp:wk:' + i.task.id + ':' + m.D, amount: dev, reason: 'نقاط تطوير من ' + name, date: m.D }); continue; }
      if (i.complete) out.push({ key: 'dp:task:' + i.task.id + ':' + m.D, amount: dev, reason: 'نقاط تطوير من ' + name, date: m.D });
    }
    return out;
  }

  /* ---------- الأسعار ---------- */
  function freezePrice(st) {
    const k = st.purchases.filter((p) => p.kind === 'freeze').length;
    return Math.min(C.FREEZE_PRICE_MAX, C.FREEZE_PRICE_START + C.FREEZE_PRICE_STEP * k);
  }
  const itemPrice = (st, kind) => (kind === 'freeze' ? freezePrice(st) : kind === 'bonus' ? C.PRICE_BONUS : kind === 'least' ? C.PRICE_LEAST : null);

  /* ---------- إعادة التشغيل الكاملة ---------- */
  /* ---------- النباتات: النمو والصحة والأوراق (مشتقة من الأيام) ---------- */
  /* ---------- البيوت الزجاجية ---------- */
  // السعات والأسعار مقترحة وقابلة للتعديل من جدول واحد هنا
  const HOUSES = [
    ['بيت الشرفة', 3, 0, 0], ['بيت الحديقة الصغير', 4, 24, 0], ['القبة الصغيرة', 5, 40, 0], ['بيت النفق', 6, 56, 0],
    ['البيت المثمّن', 8, 60, 1], ['الجملون الكلاسيكي', 10, 67, 1], ['بيت المثلث العالي', 12, 74, 1], ['البيت الريفي', 14, 81, 1], ['الدفيئة المقوّسة', 16, 88, 1],
    ['البيت الفيكتوري', 20, 100, 2], ['القبة الشبكية', 24, 125, 2], ['بيت النخيل', 28, 150, 2],
    ['القصر الزجاجي', 34, 230, 3], ['بيت البرج', 42, 290, 3],
    ['القبة الملكية', 50, 1000, 4],
  ].map((h, i) => ({ id: 'h' + String(i + 1).padStart(2, '0'), name: h[0], cap: h[1], price: h[2], rar: h[3] }));
  const ownedHouseIds = (st) => ['h01'].concat(st.purchases.filter((p) => p.kind === 'house').map((p) => p.item));
  function computeHouses(st, plants) {
    const owned = ownedHouseIds(st); const houses = HOUSES.map((h) => ({ id: h.id, name: h.name, cap: h.cap, price: h.price, rar: h.rar, owned: owned.includes(h.id), plants: [] }));
    const by = new Map(houses.map((h) => [h.id, h])); const placed = new Set(); const place = st.place || {};
    for (const p of plants) { const h = by.get(place[p.id]); if (h && h.owned && h.plants.length < h.cap) { h.plants.push(p.id); placed.add(p.id); } }
    for (const p of plants) { if (placed.has(p.id)) continue; const h = houses.find((x) => x.owned && x.plants.length < x.cap); if (h) { h.plants.push(p.id); placed.add(p.id); } }
    const totalCap = houses.filter((h) => h.owned).reduce((a, h) => a + h.cap, 0);
    return { houses, unplaced: plants.filter((p) => !placed.has(p.id)).map((p) => p.id), totalCap, free: totalCap - placed.size };
  }

  function computePlants(st, days, events, today, gifts) {
    const dates = Object.keys(days).sort();
    const evByDay = {}; events.forEach((ev) => { (evByDay[ev.D] = evByDay[ev.D] || []).push(ev.type); });
    const ups = (pid) => st.purchases.filter((p) => p.kind === 'plantUp' && p.item === pid).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.ts - b.ts));
    const out = []; const rewards = [];
    const allPu = st.purchases.filter((p) => p.kind === 'plant').concat((gifts || []).map((g) => ({ id: 'gift:' + g.ach, item: g.plant, date: g.date, gift: true })));
    for (const pu of allPu) {
      const gp = pu.gift ? GIFT_PLANTS.find((x) => x.id === pu.item) : null;
      const sp = gp ? { id: gp.art, name: gp.name, rar: gp.startLevel } : PLANTS.find((x) => x.id === pu.item); if (!sp) continue;
      const u = ups(pu.id); const lv0 = sp.rar; const level = Math.min(MAX_PLANT_LV, lv0 + u.length);
      if (!pu.gift) rewards.push({ key: 'plantget:' + pu.id, amount: PLANT_GET[lv0], reason: 'الحصول على نبتة «' + sp.name + '» (' + PLANT_LEVELS[lv0] + ')', date: pu.date });
      // دورات النمو: كل مستوى له ٣٠ يوم نجاح؛ الدورة الأولى تشمل يوم الشراء، وما بعدها تبدأ بعد يوم التطوير
      const hist = [{ date: pu.date, text: 'زُرعت النبتة' }];
      let cyc = 0, cnt = 0; let complete = false; const cycleStart = [pu.date];
      for (const D of dates) {
        if (D < pu.date) continue;
        const cur = u[cyc - 0]; // الترقية التي تُنهي الدورة الحالية
        if (days[D].status === 'success') {
          const startOk = cyc === 0 ? D >= pu.date : D > u[cyc - 1].date;
          if (startOk && cnt < GROW_DAYS) {
            cnt++;
            const sidx = plantStage(cnt), prev = plantStage(cnt - 1);
            if (sidx !== prev) hist.push({ date: D, text: 'بلغت مرحلة «' + STAGE_NAMES[sidx] + '»' });
            if (cnt === GROW_DAYS) {
              rewards.push({ key: 'plantdone:' + pu.id + ':' + cyc, amount: plantDoneReward(Math.min(MAX_PLANT_LV, lv0 + cyc)), reason: 'اكتمال نمو نبتة «' + sp.name + '» (' + PLANT_LEVELS[Math.min(MAX_PLANT_LV, lv0 + cyc)] + ')', date: D });
            }
          }
        }
        if (cur && D >= cur.date && cyc < u.length) { hist.push({ date: cur.date, text: 'طُوّرت إلى «' + PLANT_LEVELS[Math.min(MAX_PLANT_LV, lv0 + cyc + 1)] + '»' }); cyc++; cnt = 0; cycleStart.push(cur.date); }
      }
      complete = cnt >= GROW_DAYS;
      // الصحة: ٣ قلوب، وأوراق تسقط وتعود (لا تموت النبتة أبدًا)
      let hearts = 3, fallen = 0, run = 0; const cap = plantLeafTotal(level, 4);
      for (const D of dates) {
        if (D < pu.date) continue;
        const evs = evByDay[D] || [];
        if (evs.includes('frozenSave') || evs.includes('out')) {
          if (hearts > 0) { hearts--; if (hearts === 0) fallen++; } else fallen++;
          run = 0;
        }
        if (evs.includes('frozenDay')) { fallen++; run = 0; }
        if (days[D].status === 'success') {
          run++; if (fallen > 0) fallen--;
          if (run >= 10) { if (hearts < 3) hearts++; run = 0; }
        }
        if (fallen > cap) fallen = cap;
      }
      const stage = plantStage(cnt); const leaves = plantLeafTotal(level, stage);
      out.push({ id: pu.id, sp: sp.id, name: sp.name, rar0: lv0, level, levelName: PLANT_LEVELS[level], count: cnt, stage, stageName: STAGE_NAMES[stage], complete, canUpgrade: complete && level < MAX_PLANT_LV, maxed: complete && level === MAX_PLANT_LV, gift: !!pu.gift, upCost: upgradeCost(level), hearts, fallen: Math.min(fallen, leaves), leaves, date: pu.date, hist, price: pu.price });
    }
    return { plants: out, rewards };
  }

  /* ---------- الإنجازات: ١٠٠ إنجاز بثلاثة تبويبات، مشتقة بالكامل من السجل ---------- */
  const ACH_TABS = ['الاستمرارية والإنجاز', 'تطوير الشخصية', 'النباتات'];
  const ACH_MAX_REWARD = 250;

      days[D] = { status, streak, flame, main: m.reqMain.length, mainDone: m.reqMain.filter((i) => i.complete).length, side: m.sides.length, sideDone: m.sides.filter((i) => i.complete).length, ticks: m.items.reduce((a, i) => a + Math.min(i.done, i.target), 0), allMain: m.allMainDone, allSide: m.allSideDone, streakDone: m.streakDone };
      if (provisional) { todayModel = m; todayStatus = status; }

          const h = hashStr(D + 's'); if (h % C.SURPRISE_ONE_IN === 0) ledger.push({ key: 'surprise:' + D, amount: C.SURPRISE_MIN + (Math.floor(h / 7) % C.SURPRISE_SPAN), reason: 'هدية مفاجئة لإكمال يومك', date: D });
        }
        if (status === 'success') { const wk = weekStart(D, st.settings.weekStart); weekSucc[wk] = (weekSucc[wk] || 0) + 1; if (weekSucc[wk] === C.WEEK_GOAL) ledger.push({ key: 'goal:' + wk, amount: C.WEEK_GOAL_REWARD, reason: 'هدف الأسبوع: ' + C.WEEK_GOAL + ' أيام نجاح', date: D }); }
      }
    }

    // السمات والمستوى الكلي من سجل التوزيع
    const traitLevels = {}; TRAITS.forEach((t) => { traitLevels[t.id] = 1; });
    let derived = 1; const levelHist = []; const traitHist = [];
    for (const a of st.alloc) {
      if (traitLevels[a.trait] == null) continue;
      traitLevels[a.trait]++;
      traitHist.push({ trait: a.trait, level: traitLevels[a.trait], date: a.date, src: a.src });
      const nl = overallOf(TRAITS.map((t) => traitLevels[t.id]));
      while (derived < nl) { derived++; levelHist.push({ level: derived, date: a.date }); ledger.push({ key: 'level:' + derived, amount: levelReward(derived), reason: 'ارتفاع المستوى الكلي إلى ' + derived, date: a.date }); }
    }
    const giftsPre = []; { const pre = computeAchievements(st, days, events, ledger.slice(), [], levelHist, traitHist, pts, today); pre.list.forEach((a) => { const g = ACH_GIFT[a.id]; if (g && a.done) giftsPre.push({ ach: a.id, plant: g, date: a.date }); }); }
    const pl = computePlants(st, days, events, today, giftsPre); pl.rewards.forEach((r) => ledger.push(r));
    const hs = computeHouses(st, pl.plants);
    const ac = computeAchievements(st, days, events, ledger, pl.plants, levelHist, traitHist, pts, today); ac.rewards.forEach((r) => ledger.push(r));
    const successDays = Object.keys(days).filter((d) => days[d].status === 'success');
    const ptsEarned = pts.reduce((a, e) => a + e.amount, 0); const ptsSpent = st.alloc.length;

    const nextFreezeAt = (streak >= C.FREEZE_FIRST_AT && (streak - C.FREEZE_FIRST_AT) % C.FREEZE_EVERY === 0) ? streak + C.FREEZE_EVERY : nextAt;

  /* ---------- مقارنة قبل/بعد (للإشعارات ومعاينة التعديلات) ---------- */
  function ledgerDiff(a, b) {

/* ---------- تخزين ---------- */
const Store = {
  mode: 'idb', db: null,
  open() {
    return new Promise((res) => {
      try {
        const rq = indexedDB.open('istimrar', 2);
        rq.onupgradeneeded = () => { const d = rq.result; ['kv', 'diary', 'blobs'].forEach((n) => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, n === 'diary' ? { keyPath: 'id' } : undefined); }); };
        rq.onsuccess = () => { Store.db = rq.result; res(true); };
        rq.onerror = () => res(false); rq.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  async load() {
    if (!Store.db) { if (!(await Store.open())) { Store.mode = 'ls'; } }
    if (Store.mode === 'idb') {
      try { return await new Promise((res, rej) => { const r = Store.db.transaction('kv').objectStore('kv').get('state'); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); }
      catch (e) { Store.mode = 'ls'; }
    }
    try { const s = localStorage.getItem('istimrar-state'); return s ? JSON.parse(s) : null; } catch (e) { Store.mode = 'mem'; return null; }
  },
  async save(st) {
    if (Store.mode === 'idb') {
      try { await new Promise((res, rej) => { const tx = Store.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(JSON.parse(JSON.stringify(st)), 'state'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); return; }
      catch (e) { Store.mode = 'ls'; }
    }
    if (Store.mode === 'ls') { try { localStorage.setItem('istimrar-state', JSON.stringify(st)); return; } catch (e) { Store.mode = 'mem'; } }
    $('#warn').innerHTML = '<div class="note warn" style="margin-bottom:10px">تعذّر الحفظ على هذا المتصفح، لذلك ستضيع البيانات عند الإغلاق. صدّري نسخة احتياطية من الإعدادات بعد كل جلسة.</div>';
  },
};

    ['كيف أعيد كل شيء؟', '<p>أنجزي المهمة التعويضية فتعود المهام، وتعود الشعلة <b>صغيرة</b>، وتُستعاد الاستمرارية التي كانت قبل الانطفاء، وتُستعاد الأوراق الساقطة. وتكبر الشعلة بعدها مع كل يوم ناجح.</p>'],
    ['تنبيه التعويضية', '<p>عندما تكون الشعلة منطفئة أو مجمّدة يظهر <b>تنبيه أحمر كبير</b> يقول: «أنجزي المهمة التعويضية، وإلا سينقص مستواك». يظهر في صفحة المهام، وكشريط في بقية الصفحات، وكنافذة مرة واحدة كل يوم. الهدف أن تعلمي وأنت بعيدة عن التطبيق أن مهمة واحدة تكفي.</p>'],
    ['كيف أختار مهمتي التعويضية؟', '<p>من <b>الإعدادات ← استعادة الاستمرارية</b>. يمكنك أن تجعليها <b>مهمة واحدة</b> أو <b>مجموعة مهام متتابعة</b> تُنجَز بالترتيب. اختاريها مناسبة لك: قصيرة لكنها ذات معنى.</p>'],
    ['هل للاستعادة حد؟', '<p>نعم، ٣ استعادات في الشهر افتراضيًا، ويمكنك تغيير الحد من الإعدادات.</p>'],
  ] },
  { id: 'coins', ic: 'store', t: 'العملات والسوق', intro: 'العملات ⃁ مكافأتك على جهدك. تنفقينها فيما يسعدك ويحفزك.', items: [
    ['من أين تأتي العملات؟', '<ul><li>إنجاز المهام (انظري قسم المهام).</li><li>رفع المستوى الكلي لشخصيتك.</li><li>فتح الإنجازات.</li><li>الحصول على نبتة وإكمال نموها.</li><li><b>هدايا مفاجئة:</b> في بعض الأيام التي تكملين فيها مهامك الرئيسية تأتيك هدية من ٥ إلى ١٥ ⃁ دون إنذار.</li><li>الهدف الأسبوعي (٢٥ ⃁).</li></ul><p>تبدئين برصيد ٢٠ ⃁ هدية ترحيب.</p>'],
    ['ماذا أجد في السوق؟', '<p>ثلاثة أقسام: <b>العناصر</b> (تجميدة الشعلة، بطاقة زيادة المكافأة، بطاقة أقل ما يمكن، السلفة)، و<b>الملابس</b> لشخصيتك، و<b>النباتات والبيوت</b> (من صفحة البيت الزجاجي).</p>'],
    ['بطاقة زيادة المكافأة', '<p>بـ٥٠ ⃁ تُفعَّل لليوم نفسه: كل مهمة تنفذينها فيه تزيد مكافأتها ٣ ⃁.</p>'],
    ['بطاقة أقل ما يمكن', '<p>بـ٤٠ ⃁، تتيح لك في يوم متعب أن تنفذي <b>الجزء الأقل فقط</b> من مهامك (حتى ٤٠٪ من القائمة) ويُحسب اليوم ناجحًا. تُحفظ في صفحة الاستمرارية ولا تُستعمل إلا عندما تختارين.</p>'],
    ['السلفة', '<p>إذا احتجتِ عملات الآن، اكتبي المبلغ (من ١٠ إلى ٣٠٠) وتحصلين عليه فورًا <b>دون فوائد ولا غرامات</b>. ثم تُخصم نسبة صغيرة (٢٥٪) من كل مكافأة تأتيك بدءًا من الغد حتى يكتمل السداد. لا يُخصم أبدًا مبلغ كبير دفعة واحدة. سلفة واحدة فقط في كل مرة.</p>'],
  ] },
  { id: 'person', ic: 'person', t: 'الشخصية والسمات', intro: 'شخصيتك الصغيرة تكبر وتتطور بقدر ما تستمرين.', items: [
    ['السمات الست', '<p>القوة، والسرعة، والقدرة على التحمل، والتركيز، والانضباط، والذكاء والتعلم. لكل سمة مستوى وشريط يظهر تقدمك نحو هدفها القريب.</p>'],
    ['كيف أرفع سماتي؟', '<p>من نقاط التطوير التي تجمعينها من المهام. نقطة واحدة ترفع سمة واحدة مستوى واحدًا، وأنتِ تختارين السمة بزر «+ رفع». النقاط تتجمع تلقائيًا حتى لو لم تفتحي الصفحة.</p><p>إن أحببتِ فعّلي <b>التوزيع التلقائي</b> ليذهب كل جديد إلى أقل سمة مستوى.</p>'],
    ['المستوى الكلي للشخصية', '<p>رقم يظهر فوق رأسها، ويتغير هكذا:</p><ul><li>المستوى ١: البداية.</li><li>المستوى ٢: حين تصل ثلاث سمات مختلفة إلى المستوى ٥.</li><li>المستوى ٣: حين تصل كل السمات إلى ١٠.</li><li>المستوى ٤: حين تصل كلها إلى ٢٠.</li><li>بعدها يزيد مستوى كل ١٠ مستويات تبلغها كل السمات.</li></ul><p>«الهدف التالي» في الصفحة يخبرك بالضبط ما يلزم.</p>'],
    ['فئات المستوى', '<p>تتغير شارة الشخصية مع مستواها:</p><ul><li>١ – ٢٠: عادي</li><li>٢١ – ٤٠: نادر</li><li>٤١ – ٨٠: ملحمي</li><li>٨١ – ١٠٠: أسطوري</li><li>١٠١ – ١٣٠: خرافي</li><li>١٣١ – ١٧٠: خرافي مهيمن</li><li>١٧١ – ٢٢٠: خرافي متسامٍ</li><li>٢٢١ وما بعده: خرافي مطلق</li></ul><p>اضغطي على شارة المستوى في أي وقت لتشرح لك هذا.</p>'],
    ['متى ينقص المستوى؟', '<p>فقط عند التجمد الكامل (انظري قسم الانطفاء): نقطة واحدة عن كل يوم تجمد. والمهمة التعويضية توقف ذلك فورًا. سماتك نفسها لا تنقص أبدًا.</p>'],
  ] },
  { id: 'outfits', ic: 'person', t: 'الأزياء', intro: 'ألبسي شخصيتك ما يعجبك.', items: [
    ['كيف أشتري زيًّا؟', '<p>من <b>متجر الملابس</b> (زر في صفحة الشخصية). لكل زي سعر، وبعد الشراء يدخل <b>خزانة الملابس</b> وتبدّلين بينها بضغطة «ارتداء». الزي الأساسي مجاني.</p>'],
    ['الأزياء الخرافية', '<p>هناك ثلاثة أزياء من الفئات العليا: «زيّ المحاربة المهيمنة»، و«زيّ القطة الخفيّة»، و«زيّ الفجر الأبدي». لها <b>حركات تفاعلية</b>: اضغطي على الشخصية أو انتظري قليلًا لتؤدي حركة وتقول جملة.</p>'],

  { id: 'plants', ic: 'plant', t: 'النباتات والبيوت الزجاجية', intro: 'حديقتك الخاصة التي تنمو بإنجازك.', items: [
    ['كيف تنمو النباتات؟', '<p>كل نباتاتك تنمو معًا. يُحسب <b>يوم نمو</b> كلما أنجزتِ جميع مهامك الرئيسية المسؤولة عن الاستمرارية. تكتمل النبتة بعد <b>٣٠ يوم نمو</b> وتمرّ بمراحل: بذرة، ثم برعم، ثم نبتة صغيرة، ثم نامية، ثم مكتملة ومزهرة.</p>'],
    ['السقاية', '<p>أداة السقاية في صفحة البيت الزجاجي تمرّ على كل نباتاتك دفعة واحدة وتسقيها عن الأيام الناجحة.</p>'],
    ['شراء الشتلات', '<p>في المتجر ١٠٢ نبتة في خمس فئات ندرة: عادي، نادر، ملحمي، أسطوري، خرافي. كلما ندرت زاد سعرها وزادت مكافأة الحصول عليها. وتأتيك مكافأة أخرى عند اكتمال نموها.</p>'],
    ['تطوير النبتة', '<p>بعد اكتمال النبتة تستطيعين <b>ترقيتها</b> لمستوى أعلى فيتغير أصيصها وتتألق بتأثيرات جميلة. الترقية بـ١٠٠ ⃁ للمستويات الأولى ثم ٢٥٠ و٤٠٠ و٧٠٠ للمستويات الثلاثة العليا. الترقية فقط للأعلى، لا تنزل.</p>'],
    ['النباتات الخاصة بالأوسمة', '<p>ثلاث نباتات مميزة جدًا، <b>لا تُباع في المتجر أبدًا</b>، وتحصلين عليها فقط من الإنجازات الصعبة: «شجرة الهيمنة الذهبية» (خرافي مهيمن)، و«سوسنة الأفق المتسامية» (خرافي متسامٍ)، و«وردة الأبد المطلقة» (خرافي مطلق). تُدار كبقية النباتات.</p>'],
    ['البيوت الزجاجية', '<p>١٥ بيتًا بسعات وأسعار مختلفة، من «بيت الشرفة» المجاني الصغير إلى «القبة الملكية». يمكنك امتلاك عدة بيوت ونقل نباتاتك بينها. كلما صغرت السعة صغر البيت.</p>'],
    ['إذا تجمّد كل شيء', '<p>عند التجمد الكامل تبدأ أوراق النباتات تتحول للبني وتسقط تدريجيًا. لا تموت النبتة أبدًا، وتعود أوراقها بعد عودتك إلى الاستمرارية.</p>'],
  ] },
  { id: 'achv', ic: 'trophy', t: 'الإنجازات والأوسمة', intro: 'رحلتك مكتوبة هنا على شكل أوسمة.', items: [
    ['كيف تعمل؟', '<p>هناك <b>١٠٥ إنجازات</b> في ثلاثة تبويبات: الاستمرارية والإنجاز، وتطوير الشخصية، والنباتات. لكل إنجاز أيقونة مختلفة ومهمة واضحة ومستوى صعوبة من خمسة. تفتح تلقائيًا وتحصلين على مكافأة عملات (تصل إلى ٢٥٠ ⃁).</p>'],
    ['الإنجازات الثلاثة الكبرى', '<ul><li><b>٥٠٠ يوم استمرارية متتالٍ:</b> نبتة خرافية مهيمنة.</li><li><b>٧٠٠ يوم ناجح:</b> نبتة خرافية متسامية.</li><li><b>١٠٠٠ يوم استمرارية متتالٍ:</b> نبتة خرافية مطلقة.</li></ul>'],

  ] },
  { id: 'diary', ic: 'edit', t: 'اليوميات', intro: 'مساحة خاصة جدًا لتكتبي فيها ما تشائين.', items: [
    ['كيف أكتب؟', '<p>اضغطي «+ يومية جديدة» لتفتح صفحة كتابة كاملة بلا مربعات. اكتبي ما تريدين دون حد. تُحفظ تلقائيًا وتستطيعين تعديلها في أي وقت.</p>'],
    ['المزاج والمرفقات', '<p>اختاري واحدًا من ستة وجوه تعبّر عن يومك. وأضيفي <b>صورًا</b> (تظهر داخل النص كتطبيق الملاحظات) و<b>ملفات</b> و<b>روابط</b> و<b>فيديو</b>.</p>'],

  { id: 'hope', ic: 'star', t: 'أفق الأمل', intro: 'مساحة آمنة للتعافي من عادة تريدين تركها.', items: [

  { id: 'data', ic: 'gear', t: 'الإعدادات وبياناتك', intro: 'كل شيء على ذوقك، وبياناتك ملكك وحدك.', items: [

    ['أين تُحفظ بياناتي؟', '<p>على جهازك أنت داخل المتصفح أو التطبيق المثبّت. لا ترسل إلى أي خادم ولا يراها أحد. لهذا من المهم أخذ <b>نسخة احتياطية</b>.</p>'],
    ['النسخة الاحتياطية', '<p>من الإعدادات: «نسخ النسخة الاحتياطية» يعطيك نصًا طويلًا الصقيه في ملاحظاتك أو أرسليه لنفسك. وللاستعادة الصقيه في «استيراد». يذكّرك التطبيق كل أسبوع بأخذ نسخة. ولا تنسي «ملف اليوميات» لأنه منفصل.</p>'],
    ['تثبيته كتطبيق', '<p>في آيفون: افتحي الموقع في Safari ← زر المشاركة ← «إضافة إلى الشاشة الرئيسية». بعدها يعمل بلا إنترنت أيضًا.</p><p><b>مهم:</b> لا تغيّري رابط الموقع أبدًا، ولا تمسحي «بيانات المواقع» من إعدادات Safari، وإلا فقدتِ البيانات.</p>'],
    ['هل أستطيع تعديل التطبيق لاحقًا؟', '<p>نعم دائمًا. عند التحديث على الرابط نفسه تبقى بياناتك كما هي.</p>'],
  ] },
  { id: 'faq', ic: 'sun', t: 'أسئلة شائعة', intro: 'إجابات سريعة لأسئلة قد تخطر ببالك.', items: [

    ['هل تُخصم عملاتي إذا فشلت؟', '<p>أبدًا. العملات تُكسب فقط ولا تُخصم إلا عندما تشترين أنتِ شيئًا، أو من نسبة السلفة إن أخذتِها.</p>'],

    ['لماذا اختفت مهامي؟', '<p>لأن الشعلة منطفئة أو مجمدة. لم تُحذف مهامك. أنجزي المهمة التعويضية فتعود.</p>'],

  ] },

/* --- الاستمرارية --- */
function barChart(groups, series, h) {
  const W = 340, H = h || 150, pl = 8, pb = 22, pt = 10; const max = Math.max(1, ...groups.flatMap((g) => g.v));
  const gw = (W - pl * 2) / groups.length; const bw = Math.min(14, gw / 2.6);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="مقارنة">';
  [0, .5, 1].forEach((f) => { const y = pt + (H - pb - pt) * (1 - f); s += '<line x1="' + pl + '" x2="' + (W - pl) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1" ' + (f ? 'stroke-dasharray="3 4"' : '') + '/>'; });
  groups.forEach((g, i) => {
    const cx = pl + gw * (i + .5);
    g.v.forEach((val, k) => {
      const bh = (H - pb - pt) * (val / max); const x = cx + (k === 0 ? -bw - 1 : 1);
      s += '<rect x="' + x + '" y="' + (H - pb - bh) + '" width="' + bw + '" height="' + Math.max(bh, val ? 2 : 0) + '" rx="3" fill="' + series[k] + '"/>';
      if (val) s += '<text x="' + (x + bw / 2) + '" y="' + (H - pb - bh - 3) + '" font-size="9" text-anchor="middle" fill="var(--ink2)">' + N(val) + '</text>';
    });
    s += '<text x="' + cx + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" fill="var(--ink2)">' + esc(g.l) + '</text>';
  });
  return s + '</svg>';
}

  return { quiet: 'qt', frozenSave: 'fz', freezeStart: 'fz', frozenDay: 'fz', out: 'ot', restored: 'rs', idle: 'id' }[st] || '';
}
function viewCal() {

function openLoan() {

function checkAchSeen() {
  const doneIds = new Set(R.ach.filter((a) => a.done).map((a) => a.id));
  const before = ST.ack.length; ST.ack = ST.ack.filter((k) => k.indexOf('achseen:') !== 0 || doneIds.has(k.slice(8)));
  const fresh = R.ach.filter((a) => a.done && !ST.ack.includes('achseen:' + a.id));
  if (ST.ack.length !== before || fresh.length) persist();
  if (!fresh.length) return;
  fresh.forEach((a) => ST.ack.push('achseen:' + a.id)); persist();
  const sum = fresh.reduce((s, a) => s + a.reward, 0);
  if (fresh.length <= 3) fresh.forEach((a, i) => setTimeout(() => toast({ html: '<div class="row" style="gap:10px"><div style="width:42px;flex:none">' + AchArt.icon(a, { noNum: true }) + '</div><div>فتحتِ إنجاز «' + esc(a.name) + '» <b class="num">+' + N(a.reward) + '</b> ' + sar + (i === fresh.length - 1 ? '<div class="bal">الرصيد الآن: ' + N(R.balance) + '</div>' : '') + '</div></div>' }), 500 + i * 300));
  else setTimeout(() => toast({ html: 'فتحتِ <b class="num">' + N(fresh.length) + '</b> إنجازات جديدة <b class="num">+' + N(sum) + '</b> ' + sar + '<div class="bal">الرصيد الآن: ' + N(R.balance) + '</div>' }), 500);

}

  const buys = ST.purchases.slice(-15).reverse().map((p) => '<li class="small">شراء ' + (p.kind === 'outfit' ? 'زي «' + ((E.OUTFITS.find((x) => x.id === p.item) || {}).name || '') + '»' : { freeze: 'تجميدة', bonus: 'بطاقة زيادة المكافأة', least: 'بطاقة أقل ما يمكن' }[p.kind]) + ' بـ ' + N(p.price) + ' · <span class="muted">' + dshort(p.date) + '</span></li>').join('');

    '<div class="card stack"><h3>استعادة الاستمرارية</h3><div class="field"><label>أقصى عدد استعادات في الشهر</label><div class="stepper"><button class="circ mini" data-act="restLim" data-d="-1" aria-label="أقل">' + ico('minus') + '</button><output class="num">' + N(s.restoreLimit) + '</output><button class="circ mini" data-act="restLim" data-d="1" aria-label="أكثر">' + ico('plus') + '</button></div></div>' +
    '<div class="field"><div class="lbl">نوع المهمة التعويضية</div><div class="seg"><button data-act="compMode" data-m="single" aria-pressed="' + (s.compMode === 'single') + '">مهمة واحدة</button><button data-act="compMode" data-m="sequence" aria-pressed="' + (s.compMode === 'sequence') + '">مهام متتابعة</button></div></div>' +
    '<div class="field"><div class="lbl">نص المهمة التعويضية' + (s.compMode === 'sequence' ? ' (كل خطوة)' : '') + '</div>' + steps.map((t, i) => '<div class="row"><input type="text" data-comp="' + i + '" value="' + esc(t) + '" placeholder="مثال: اكتبي ثلاث أسباب تمنعك وأعيدي ترتيب يومك"' + (s.compMode === 'single' && i > 0 ? ' disabled' : '') + '>' + (s.compMode === 'sequence' && steps.length > 1 ? '<button class="edit" data-act="rmStep" data-i="' + i + '" aria-label="حذف">' + ico('x') + '</button>' : '') + '</div>').join('') + (s.compMode === 'sequence' ? '<button class="btn soft" data-act="addStep">+ خطوة</button>' : '') + '</div></div>' +
